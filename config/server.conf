# Proxy Server Configuration
# Note: In this version, these values are defined as compile-time constants in src/proxy.cpp.

# Networking
PORT=8080
BACKLOG=10
LISTENING_ADDR=0.0.0.0 (INADDR_ANY)

# Concurrency
THREAD_MODEL=pthread (Thread-per-connection)
STACK_SIZE=Default

# Caching
CACHE_POLICY=InMemory (Infinite/No Eviction)
CACHE_LOCK=pthread_mutex

# Logging
LOG_OUTPUT=stdout
LOG_FORMAT=[Timestamp] Client: <IP> | Request: <Host> | Action: <Action>

# Filtering
FILTER_FILE=config/blocked_domains.txt